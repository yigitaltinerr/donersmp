<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DÖNER SMP – Minecraft SMP Sunucusu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap">
<style>
:root{--bg:#fff6e8;--bg2:#ffe6c4;--tx:#2b1708;--mut:#7a5a3c;--card:#fffaf2;--or:#f08a24;--or2:#b8570c;--f:'Pixelify Sans',ui-monospace,Menlo,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15100b;--bg2:#241a10;--tx:#fff4e6;--mut:#cdb79e;--card:#2a1d12}}
:root[data-theme="dark"]{--bg:#15100b;--bg2:#241a10;--tx:#fff4e6;--mut:#cdb79e;--card:#2a1d12}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,'Segoe UI',sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg2);z-index:10}
h1,h2,h3,.brand,.btn,.tag,.sg b{font-family:var(--f)}
p{margin:0}
.w{max-width:1040px;margin:0 auto;padding:0 20px}
section.w{padding-top:44px;padding-bottom:12px}
h2{font-size:30px;margin:0 0 20px}
h3{font-size:20px;margin:6px 0}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg2);border-bottom:4px solid #000}
.nv{display:flex;align-items:center;gap:18px;height:62px}
.brand{font-size:22px;font-weight:700;color:var(--or);text-decoration:none;margin-right:auto}
.nv nav{display:flex;gap:18px}
.nv nav a{color:var(--tx);text-decoration:none;font-weight:600}
.nv nav a:hover{color:var(--or)}
@media(max-width:700px){.nv nav{display:none}}
.hb{background:repeating-conic-gradient(rgba(240,138,36,.09) 0 25%,transparent 0 50%) 0 0/36px 36px;border-bottom:4px solid #000}
.hero{display:grid;gap:32px;align-items:center;padding-top:44px;padding-bottom:48px}
@media(min-width:820px){.hero{grid-template-columns:5fr 6fr}}
.logo{background:#fff4e0;border:4px solid #000;box-shadow:8px 8px 0 var(--or2);padding:10px}
.logo img{display:block;width:100%;height:auto;mix-blend-mode:multiply;image-rendering:pixelated}
.tag{display:inline-block;background:var(--or);color:#1a0d02;border:3px solid #000;padding:2px 10px;font-weight:700;font-size:14px}
h1{font-size:clamp(28px,5vw,44px);line-height:1.15;margin:14px 0}
.lead{color:var(--mut);font-size:18px}
.ip{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--bg2);border:3px solid #000;padding:10px 12px;margin:20px 0}
.ip small{color:var(--mut);font-weight:700;width:100%}
.ip b{flex:1;min-width:0;overflow-wrap:anywhere;font:700 22px var(--f);color:var(--or)}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:16px;font-weight:700;background:var(--or);color:#1a0d02;border:3px solid #000;box-shadow:0 4px 0 #000;padding:8px 16px;text-decoration:none;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.btn.alt{background:#fff4e0}
.it{position:relative}
.sg,.g,.g1{display:grid;gap:18px;counter-reset:n}
.sg{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));text-align:center}
.g{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.sg b{display:block;font-size:34px;color:var(--or)}
.sg span{color:var(--mut);font-weight:600}
.it.features,.it.news,.it.steps,.it.rules,.it.stats,.cta{background:var(--card);border:3px solid #000;box-shadow:5px 5px 0 #000;padding:16px 18px}
.it p{color:var(--mut)}
.ic{font-size:32px}
.d{color:var(--or);font-weight:700}
.it.steps::before,.it.rules::before{counter-increment:n;content:counter(n);display:grid;place-items:center;flex:none;min-width:38px;height:38px;background:var(--or);color:#1a0d02;border:3px solid #000;font:700 20px var(--f)}
.it.rules{display:flex;gap:14px;align-items:center;padding-right:44px}
.cta{text-align:center;padding:28px 20px}
.cta p{color:var(--mut);margin:0 0 18px}
footer{margin-top:44px;border-top:4px solid #000;background:var(--bg2);padding:24px 0 100px;color:var(--mut);font-size:14px;text-align:center}
.x{position:absolute;top:6px;right:6px;width:26px;height:26px;padding:0;align-items:center;justify-content:center;background:#c0392b;color:#fff;border:2px solid #000;font-weight:700;cursor:pointer}
.add{margin-top:16px}
.adm{display:none!important}
body.edit .adm{display:inline-flex!important}
body.edit #ed{display:none}
body.edit [contenteditable]{outline:2px dashed var(--or);outline-offset:2px;cursor:text}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;background:var(--bg2);border:3px solid #000;box-shadow:4px 4px 0 #000;padding:8px 10px;width:max-content;max-width:calc(100% - 24px)}
.bar input{font:inherit;padding:7px 9px;border:3px solid #000;background:var(--card);color:var(--tx);width:240px;max-width:100%}
</style>
</head>

function collect(){$$('[data-k]').forEach(n=>S.t[n.dataset.k]=n.textContent.trim());

document.addEventListener('click',ev=>{
const t=ev.target.closest('[data-add],[data-del],#cp,#ed,#sv,#cx');if(!t)return;
if(t.id==='cp')return cp(t);
if(t.id==='ed')return setEdit(true);
if(t.id==='sv')return save();
if(t.id==='cx'){const o=JSON.parse($('#state').textContent);Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,o);$('#dc').value=S.discord;msg('');setEdit(false);return render()}
collect();
if(t.dataset.add)S[t.dataset.add].push({...TPL[t.dataset.add]});
else{const p=t.dataset.del.split(':');S[p[0]].splice(+p[1],1)}
render()});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.isContentEditable)ev.preventDefault()});
document.addEventListener('paste',ev=>{if(ev.target.isContentEditable){ev.preventDefault();document.execCommand('insertText',false,(ev.clipboardData.getData('text')||'').replace(/\s+/g,' '))}});
function adminInit(){const b=document.createElement('div');b.className='bar';
b.innerHTML='<b>🛠 Yönetici</b><button class="btn" id="ed">✏️ Düzenle</button><input id="dc" class="adm" placeholder="Discord bağlantısı (https://…)"><button class="btn adm" id="sv">💾 Kaydet</button><button class="btn alt adm" id="cx">Vazgeç</button><span id="ms"></span>';
document.body.appendChild(b);$('#dc').value=S.discord}
render();
(async()=>{try{const u=await claude.use('user');if(u&&await u.isOwner())adminInit()}catch(_){}})();
}
main();
</script>
</body>
</html>
